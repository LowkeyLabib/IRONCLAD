name: IRONCLAD iOS production build (EAS)

# Apple Developer signing and an Expo account are required before enabling this.
# Set repository secret EXPO_TOKEN and run npx eas init/credentials locally first.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: Request signed iOS build on Expo EAS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install packages and generate branded artwork
        run: npm install --no-audit --no-fund
      - name: Validate iOS-compatible TypeScript
        run: npm run typecheck
      - name: Create iOS production build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo "::error::Set EXPO_TOKEN in repository secrets and connect an Expo project first"; exit 1; }
          npx --yes eas-cli build --platform ios --profile production --non-interactive --no-wait
