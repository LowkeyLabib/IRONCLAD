name: Android test APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone APK
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use hosted Android SDK
        run: |
          set -e
          test -d "$ANDROID_HOME"
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          test -x "$SDKMGR"
          echo "Using SDK manager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install JavaScript packages
        run: npm install --no-audit --no-fund
      - name: Test training logic
        run: npm run test:logic
      - name: TypeScript check (report issues but still attempt first APK)
        continue-on-error: true
        run: npm run typecheck
      - name: Generate Android native project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'
      - name: Compile standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ironclad-android-test-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
